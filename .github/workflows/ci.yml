name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries (Linux, Qt needs GL/egl/xkb stubs)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      # - name: Format check
      #   run: ruff format --check .

      # - name: Lint
      #   run: ruff check .

      # - name: Type check (core + io, strict)
      #   run: mypy src/thermavisualizer/core src/thermavisualizer/io

      - name: Tests (offscreen)
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen