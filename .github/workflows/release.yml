name: Release build (Windows exe)

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run test suite (offscreen)
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build executable (PyInstaller)
        run: python -m PyInstaller packaging/thermavisualizer.spec --noconfirm --clean

      - name: Verify output
        shell: pwsh
        run: |
          Test-Path dist/ThermaVisualizer/ThermaVisualizer.exe
          if (-not (Test-Path dist/ThermaVisualizer/ThermaVisualizer.exe)) {
            throw "ThermaVisualizer.exe was not produced"
          }

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ThermaVisualizer/* `
            -DestinationPath "ThermaVisualizer-${{ github.ref_name }}-windows-x64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thermavisualizer-${{ github.ref_name }}-windows-x64
          path: Thermavisualizer-${{ github.ref_name }}-windows-x64.zip
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $zip = "ThermaVisualizer-${{ github.ref_name }}-windows-x64.zip"
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
          }
          gh release upload "${{ github.ref_name }}" $zip --clobber